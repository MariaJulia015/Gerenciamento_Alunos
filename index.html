<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EC01 - DevTech Academy - Alunos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar bg-body-tertiary">
        <div class="container justify-content-center">
            <span class="navbar-brand mb-0 h1">DevTech Academy - Gerenciamento de Alunos</span>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Cadastro de Alunos</h2>
        <hr>
        <form id="formAluno" method="post">
            <div class="row">
                <div class="col-md-4">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="nome" name="nome" placeholder="Nome" required>
                        <label for="nome">Nome</label>
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="form-floating mb-3">
                        <input type="number" class="form-control" id="idade" name="idade" min="0" placeholder="Idade" required>
                        <label for="idade">Idade</label>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-floating mb-3">
                        <select class="form-select" id="curso" name="curso" required>
                            <option value="">Selecione</option>
                            <option value="JavaScript">JavaScript</option>
                            <option value="Python">Python</option>
                            <option value="Java">Java</option>
                        </select>
                        <label for="curso">Curso</label>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-floating mb-3">
                        <input type="number" class="form-control" id="notaFinal" name="notaFinal" min="0" max="10" step="0.1" placeholder="Nota Final" required>
                        <label for="notaFinal">Nota Final</label>
                    </div>
                </div>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <input type="button" class="btn btn-secondary" id="btnCancelar" value="Cancelar edição">
                <input type="submit" class="btn btn-primary" id="btnCadastrar" value="Cadastrar">
            </div>
        </form>

        <h2 class="mt-5">Alunos Cadastrados</h2>
        <hr>
        <table class="table table-striped text-center">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Curso</th>
                    <th>Nota Final</th>
                    <th>Situação</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaAlunos">
            </tbody>
        </table>

        <h2 class="mt-5">Relatórios</h2>
        <hr>
        <div class="row">
            <div class="col-md mb-2 d-grid"><input type="button" class="btn btn-outline-primary" id="btnAprovados" value="Alunos aprovados"></div>
            <div class="col-md mb-2 d-grid"><input type="button" class="btn btn-outline-primary" id="btnMediaNotas" value="Média das notas"></div>
            <div class="col-md mb-2 d-grid"><input type="button" class="btn btn-outline-primary" id="btnMediaIdades" value="Média das idades"></div>
            <div class="col-md mb-2 d-grid"><input type="button" class="btn btn-outline-primary" id="btnOrdemAlfabetica" value="Ordem alfabética"></div>
            <div class="col-md mb-2 d-grid"><input type="button" class="btn btn-outline-primary" id="btnPorCurso" value="Alunos por curso"></div>
        </div>
        <div id="resultadoRelatorio" class="mt-3 mb-5"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
