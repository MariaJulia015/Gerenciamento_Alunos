<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EC01 - DevTech Academy - Alunos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand"><i class="bi bi-mortarboard-fill"></i> DevTech Academy - Gerenciamento de Alunos</span>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="bi bi-person-plus"></i> Cadastro de Alunos</h5>
                    </div>
                    <div class="card-body">
                        <form id="formAluno" method="post">
                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome:</label>
                                <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite o nome" required>
                            </div>
                            <div class="mb-3">
                                <label for="idade" class="form-label">Idade:</label>
                                <input type="number" class="form-control" id="idade" name="idade" min="0" placeholder="Digite a idade" required>
                            </div>
                            <div class="mb-3">
                                <label for="curso" class="form-label">Curso:</label>
                                <select class="form-select" id="curso" name="curso" required>
                                    <option value="">-- Selecione --</option>
                                    <option value="JavaScript">JavaScript</option>
                                    <option value="Python">Python</option>
                                    <option value="Java">Java</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="notaFinal" class="form-label">Nota Final:</label>
                                <input type="number" class="form-control" id="notaFinal" name="notaFinal" min="0" max="10" step="0.1" placeholder="Digite a nota final" required>
                            </div>
                            <div class="d-flex gap-2">
                                <input type="submit" class="btn btn-success" id="btnCadastrar" value="Cadastrar">
                                <input type="button" class="btn btn-outline-secondary" id="btnCancelar" value="Cancelar edição">
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="bi bi-table"></i> Alunos Cadastrados</h5>
                    </div>
                    <div class="card-body table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Nome</th>
                                    <th>Idade</th>
                                    <th>Curso</th>
                                    <th>Nota Final</th>
                                    <th>Situação</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaAlunos">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm my-4">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="bi bi-bar-chart"></i> Relatórios</h5>
            </div>
            <div class="card-body">
                <div class="d-flex flex-wrap gap-2 mb-3">
                    <input type="button" class="btn btn-outline-primary" id="btnAprovados" value="Alunos aprovados">
                    <input type="button" class="btn btn-outline-primary" id="btnMediaNotas" value="Média das notas finais">
                    <input type="button" class="btn btn-outline-primary" id="btnMediaIdades" value="Média das idades">
                    <input type="button" class="btn btn-outline-primary" id="btnOrdemAlfabetica" value="Nomes em ordem alfabética">
                    <input type="button" class="btn btn-outline-primary" id="btnPorCurso" value="Quantidade de alunos por curso">
                </div>
                <div id="resultadoRelatorio" class="alert alert-info mb-0">Clique em um relatório para ver o resultado.</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
